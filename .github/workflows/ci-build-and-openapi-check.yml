################################################################################
# Workflow: ci-build-and-openapi-check.yml
# But : build + tests + génération/comparaison OpenAPI canonique
# Compatibilité : Compatible avec les autres workflows. Conçu pour être lancé
#                manuellement (workflow_dispatch) ou en PR selon les triggers.
# Détails :
# - Compile backend & frontend, exécute tests module par module.
# - Valide la présence de `docs/openapi/openapi.json` et compare la spec
#   générée (plugin springdoc ou démarrage doc-only) avec le canonical.
# - L'analyse Sonar est volontairement désactivée ici par défaut. Elle peut
#   être activée en ajoutant les secrets GitHub (`SONAR_HOST_URL`, `SONAR_TOKEN`,
#   `SONAR_ORGANIZATION`) ou en décommentant la section correspondante.
# Recommandation : Conserver ce workflow; il est le plus complet pour la vérif
#                  OpenAPI et les tests d'intégration légers.
################################################################################
name: CI — build, tests et vérification OpenAPI canonique


on:
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create frontend logging directories
        # Certains tests / l'application attendent des fichiers de log sous frontend/logs
        # et parfois sous frontend/frontend/logs en local. Crée les répertoires attendus
        # pour éviter les FileNotFoundException de Logback en CI.
        run: |
          mkdir -p frontend/logs/technique frontend/logs/metier frontend/logs/securite || true
          mkdir -p frontend/frontend/logs || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile backend and frontend
        run: mvn -pl backend,frontend -DskipTests compile

      - name: Run backend tests
        run: mvn -pl backend test

      - name: Run frontend tests
        run: mvn -pl frontend test

      # Sonar analysis removed to disable automatic CI Sonar scans.

      - name: Valider OpenAPI canonique (présence + format)
        # Vérifie simplement la présence du fichier canonical et sa clé `openapi`.
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/openapi/openapi.json")
          if not p.exists():
              raise SystemExit("docs/openapi/openapi.json est manquant")
          data = json.loads(p.read_text(encoding="utf-8"))
          if "openapi" not in data:
              raise SystemExit("docs/openapi/openapi.json ne ressemble pas à OpenAPI")
          print("Version OpenAPI canonique:", data["openapi"])
          PY

      - name: Générer et comparer OpenAPI (mode doc-only)
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_FLYWAY_ENABLED: "false"
          AXON_AXONSERVER_ENABLED: "false"
          APP_SECURITY_ENABLED: "false"
          SPRING_DATASOURCE_URL: jdbc:h2:mem:sma_openapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect
        run: |
          set -euo pipefail
          nohup mvn -pl backend -DskipTests \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.arguments="--spring.flyway.enabled=false --axon.axonserver.enabled=false --app.security.enabled=false --spring.main.allow-bean-definition-overriding=true --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration" \
            spring-boot:run > backend-openapi.log 2>&1 &
          MVN_PID=$!
          echo "Backend démarré (PID=$MVN_PID), attente de /v3/api-docs..."
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8092/v3/api-docs >/dev/null 2>&1; then
              echo "OpenAPI disponible"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8092/v3/api-docs >/dev/null 2>&1; then
            echo "Erreur: /v3/api-docs non disponible dans le délai imparti"
            echo "=== logs backend ==="
            tail -n +1 backend-openapi.log || true
            kill $MVN_PID || true
            exit 1
          fi
          ./scripts/openapi-verify.sh compare-live
          echo "Arrêt du backend (PID=$MVN_PID)"
          kill $MVN_PID || true
          sleep 3 || true


