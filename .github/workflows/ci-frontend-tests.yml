name: CI minimal - frontend tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create frontend logging directories
        run: |
          mkdir -p frontend/logs/technique frontend/logs/metier frontend/logs/securite
          mkdir -p frontend/frontend/logs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile frontend
        run: mvn -B -pl frontend -DskipTests compile

      - name: Run frontend tests
        run: mvn -B -pl frontend test -e -Dspring.test.context.failure.threshold=1000000

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surefire-reports
          path: frontend/target/surefire-reports