################################################################################
# Workflow: ci-build-and-openapi-check-sonarcloud.yml
# But : build, tests, vérification OpenAPI et (historique) intégration SonarCloud
# Compatibilité : Compatible avec les autres workflows du dossier. Ne bloque pas
#                les autres workflows, ils peuvent coexister. Ce fichier est une
#                variante destinée à utiliser l'action officielle SonarCloud.
# Remarques :
# - Le fichier a été conservé pour historicité et pour un usage explicite SonarCloud.
# - L'étape Sonar est actuellement retirée (commentée ou supprimée) dans ce repo
#   pour éviter des exécutions automatiques si les secrets ne sont pas fournis.
# - Garder ce workflow est recommandé : il sert de référence et peut être activé
#   simplement en ré-introduisant l'étape Sonar ou en ajoutant les secrets GitHub.
################################################################################
name: CI — build, tests et vérification OpenAPI + SonarCloud


on:
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create frontend logging directories
        run: |
          # Some tests / the application expect log files under frontend/logs
          # and in some local runs under frontend/frontend/logs. Create both
          # locations and the expected subdirectories to avoid FileNotFoundException
          mkdir -p frontend/logs/technique frontend/logs/metier frontend/logs/securite || true
          mkdir -p frontend/frontend/logs || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile backend and frontend
        run: mvn -pl backend,frontend -DskipTests compile

      - name: Run backend tests
        run: mvn -pl backend test

      - name: Run frontend tests
        run: mvn -pl frontend test

      - name: Upload frontend test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surefire-reports
          path: frontend/target/surefire-reports

      - name: Tail frontend surefire failures (on failure)
        if: failure()
        run: |
          echo "-- Listing surefire report files --"
          ls -l frontend/target/surefire-reports || true
          echo "-- Showing first 200 lines of each failure report --"
          for f in frontend/target/surefire-reports/*.txt; do
            echo "== $f ==";
            sed -n '1,200p' "$f" || true;
          done

      # SonarCloud analysis - runs conditionally if SONAR_TOKEN secret is available
      - name: SonarCloud analysis (conditional)
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        run: |

          # Run SonarCloud only when all required secrets are present
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_ORGANIZATION }}" ] && [ -n "${{ secrets.SONAR_PROJECT_KEY }}" ]; then
            echo "Sonar secrets present — running mvn sonar:sonar"
            mvn -B -DskipTests \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.login="${{ secrets.SONAR_TOKEN }}" \
              -Dsonar.organization="${{ secrets.SONAR_ORGANIZATION }}" \
              -Dsonar.projectKey="${{ secrets.SONAR_PROJECT_KEY }}" \
              sonar:sonar
          else
            echo "Sonar secrets missing — skipping SonarCloud analysis"
            echo "Set secrets: SONAR_TOKEN, SONAR_ORGANIZATION and SONAR_PROJECT_KEY to enable analysis"
          fi

      - name: Valider OpenAPI canonique (présence + format)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/openapi/openapi.json")
          if not p.exists():
              raise SystemExit("docs/openapi/openapi.json est manquant")
          data = json.loads(p.read_text(encoding="utf-8"))
          if "openapi" not in data:
              raise SystemExit("docs/openapi/openapi.json ne ressemble pas à OpenAPI")
          print("Version OpenAPI canonique:", data["openapi"])
          PY

      - name: Générer et comparer OpenAPI (mode doc-only)
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_FLYWAY_ENABLED: "false"
          AXON_AXONSERVER_ENABLED: "false"
          APP_SECURITY_ENABLED: "false"
          SPRING_DATASOURCE_URL: jdbc:h2:mem:sma_openapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect
        run: |
          set -euo pipefail
          nohup mvn -pl backend -DskipTests \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.arguments="--spring.flyway.enabled=false --axon.axonserver.enabled=false --app.security.enabled=false --spring.main.allow-bean-definition-overriding=true --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration" \
            spring-boot:run > backend-openapi.log 2>&1 &
          MVN_PID=$!
          echo "Backend démarré (PID=$MVN_PID), attente de /v3/api-docs..."
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8092/v3/api-docs >/dev/null 2>&1; then
              echo "OpenAPI disponible"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8092/v3/api-docs >/dev/null 2>&1; then
            echo "Erreur: /v3/api-docs non disponible dans le délai imparti"
            echo "=== logs backend ==="
            tail -n +1 backend-openapi.log || true
            kill $MVN_PID || true
            exit 1
          fi
          ./scripts/openapi-verify.sh compare-live
          echo "Arrêt du backend (PID=$MVN_PID)"
          kill $MVN_PID || true
          sleep 3 || true

      - name: Upload backend openapi log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi-log
          path: backend-openapi.log

