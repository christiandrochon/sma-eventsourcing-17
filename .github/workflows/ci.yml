name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile backend and frontend
        run: mvn -pl backend,frontend -DskipTests compile

      - name: Run backend tests
        run: mvn -pl backend test

      - name: Run frontend tests
        run: mvn -pl frontend test

      - name: Validate canonical OpenAPI JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/openapi/openapi.json")
          if not p.exists():
              raise SystemExit("docs/openapi/openapi.json is missing")
          data = json.loads(p.read_text(encoding="utf-8"))
          if "openapi" not in data:
              raise SystemExit("docs/openapi/openapi.json does not look like OpenAPI")
          print("OpenAPI version:", data["openapi"])
          PY

