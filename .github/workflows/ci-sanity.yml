################################################################################
# Workflow: ci-sanity.yml
# But : simple sanity check minimal déclenché sur la branche `test/trigger-ci`.
# Ceci sert à valider l'intégration GitHub Actions et à déclencher manuellement
# un run léger pour debug (ne compile pas, ne teste pas). Conservé pour tests
# de déclenchement et debug runner.
################################################################################
name: CI Sanity Check

on:
  push:
    branches: ["test/trigger-ci"]
  pull_request:
    branches: ["test/trigger-ci"]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print info
        run: |
          echo "Sanity workflow running"
          echo "Branch: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"

