# Frontend - PROD (Docker)

server.port=8091
external.service.url=http://backend:8092
vehicule.json.path=classpath:vehicules.json

spring.thymeleaf.cache=false
logging.level.org.springframework=INFO
logging.file.path=/home/cdn/IdeaProjects/sma-eventsourcing-17/frontend/logs

# Security prod
app.security.enabled=${APP_SECURITY_ENABLED:true}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URL:http://keycloak:8080/realms/sma-realm}
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:sma-thymeleaf-frontend}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=${KEYCLOAK_CLIENT_AUTH_METHOD:none}

