<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="template">
<head>
    <meta charset="UTF-8">
    <title>Creation Vehicule</title>
    <!-- use shared JS: perso.js is included by the layout template -->
</head>
<body>
<div layout:fragment="content">
    <main class="container mt-5">

        <h6><a th:href="@{/vehicules}">Retour aux véhicules</a></h6>
        <div class="mt-lg-5">
            <h3>Création d'un véhicule</h3>
        </div>

        <form action='#' th:action="@{/createVehicule}" method='post' th:object="${vehiculePostDTO}">
            <div class="row g-3">

                <div th:replace="fragments/vehicleField :: vehicle_createVehicule"></div>


                <hr class="my-4 mt-5">
                <button class="w-100 btn btn-primary btn-lg " type="submit">Valider</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
