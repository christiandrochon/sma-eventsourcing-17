<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="template">
<head>
    <meta charset="UTF-8">
    <title>Recherche Vehicule SIV</title>

    <!-- use shared JS: perso.js is included by the layout template -->
</head>
<body>
<div layout:fragment="content">
    <main class="container mt-5">
        <h6><a th:href="@{/vehicules}">Retour aux véhicules</a></h6>
        <div class="mt-lg-5">
            <h3>Recherche d'un véhicule sur SIV</h3>
        </div>

        <div class="w-100 py-2">
            <div class="pt-4 pb-3">
                <p>Recherchez un véhicule sur le SIV en saisissant son immatriculation</p>
            </div>
            <form th:action="@{/searchvehiculesiv}" method="post" class="needs-validation" novalidate th:object="${getImmatDTO}">
                <div class="row g-3">
                    <div class="w-100">
                        <div th:replace="fragments/immatField :: immat_search"></div>
                    </div>

                    <hr class="my-4 mt-5">
                    <button class="w-100 btn btn-primary btn-lg " type="submit">Valider</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
