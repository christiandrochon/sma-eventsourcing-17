<!DOCTYPE html>
<div xmlns:th="http://www.thymeleaf.org">

  <!-- address fragment top-level: *{adresse.xxx} -->
  <div th:fragment="address_simple">
    <div class="my-3 mt-4">
      <h5>Adresse du client</h5>
    </div>
    <div>
      <label class="form-label">N° de rue</label>
      <input class="form-control numeroDeRue" type="text" th:field="*{adresse.numeroDeRue}"
             th:classappend="${#fields.hasErrors('adresse.numeroDeRue')} ? 'validation-champ-surimpression'" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('adresse.numeroDeRue')}" th:errors="*{adresse.numeroDeRue}">Erreur de numéro de rue dans l'adresse</div>
    </div>

    <div>
      <label class="form-label">Nom de la rue</label>
      <input class="form-control rue" type="text" th:field="*{adresse.rue}"
             th:classappend="${#fields.hasErrors('adresse.rue')} ? 'validation-champ-surimpression'" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('adresse.rue')}" th:errors="*{adresse.rue}">Erreur du nom de la rue dans l'adresse</div>
    </div>

    <div>
      <label class="form-label">Code postal</label>
      <input class="form-control cp" type="text" th:field="*{adresse.cp}" placeholder="00000" pattern="[0-9]{5}"
             th:classappend="${#fields.hasErrors('adresse.cp')} ? 'validation-champ-surimpression'" oninput="formatCp(this)" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('adresse.cp')}" th:errors="*{adresse.cp}">Erreur de code postal</div>
    </div>

    <div>
      <label class="form-label">Ville</label>
      <input class="form-control ville" type="text" th:field="*{adresse.ville}"
             th:classappend="${#fields.hasErrors('adresse.ville')} ? 'validation-champ-surimpression'" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('adresse.ville')}" th:errors="*{adresse.ville}">Ville inconnue</div>
    </div>

    <div class="col-md-5">
      <label class="form-label">Pays</label>
      <select class="form-select pays" th:field="*{adresse.pays}" required>
        <option th:each="pays : ${paysList}" th:value="${pays}" th:text="${pays}" th:if="${pays} == ${valeurPaysParDefaut}" selected="selected"></option>
        <option th:each="pays : ${paysList}" th:value="${pays}" th:text="${pays}" th:unless="${pays} == ${valeurPaysParDefaut}"></option>
      </select>
    </div>
  </div>

  <!-- address fragment embedded: client.adresse.* or vehicule.owner.adresse.* -> use client.adresse in this project -->
  <div th:fragment="address_embedded">
    <div class="my-3 mt-4">
      <h5>Adresse du client</h5>
    </div>
    <div>
      <label class="form-label">N° de rue</label>
      <input class="form-control numeroDeRue" type="text" th:field="*{client.adresse.numeroDeRue}"
             th:classappend="${#fields.hasErrors('client.adresse.numeroDeRue')} ? 'validation-champ-surimpression'" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('client.adresse.numeroDeRue')}" th:errors="*{client.adresse.numeroDeRue}">Erreur de numéro de rue dans l'adresse</div>
    </div>

    <div>
      <label for="rue" class="form-label">Nom de la rue</label>
      <input id="rue" class="form-control" type="text" th:field="*{client.adresse.rue}"
             th:classappend="${#fields.hasErrors('client.adresse.rue')} ? 'validation-champ-surimpression'" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('client.adresse.rue')}" th:errors="*{client.adresse.rue}">Erreur du nom de la rue dans l'adresse</div>
    </div>

    <div>
      <label for="cp" class="form-label">Code postal</label>
      <input id="cp" class="form-control" type="text" th:field="*{client.adresse.cp}" placeholder="00000" pattern="[0-9]{5}"
             th:classappend="${#fields.hasErrors('client.adresse.cp')} ? 'validation-champ-surimpression'" oninput="formatCp(this)" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('client.adresse.cp')}" th:errors="*{client.adresse.cp}">Erreur de code postal</div>
    </div>

    <div>
      <label for="ville" class="form-label">Ville</label>
      <input id="ville" class="form-control" type="text" th:field="*{client.adresse.ville}"
             th:classappend="${#fields.hasErrors('client.adresse.ville')} ? 'validation-champ-surimpression'" required>
      <div class="validation-champ-incorrect" th:if="${#fields.hasErrors('client.adresse.ville')}" th:errors="*{client.adresse.ville}">Ville inconnue</div>
    </div>

    <div class="col-md-5">
      <label for="pays" class="form-label">Pays</label>
      <select class="form-select" id="pays" th:field="*{client.adresse.pays}" required>
        <option th:each="pays : ${paysList}" th:value="${pays}" th:text="${pays}" th:if="${pays} == ${valeurPaysParDefaut}" selected="selected"></option>
        <option th:each="pays : ${paysList}" th:value="${pays}" th:text="${pays}" th:unless="${pays} == ${valeurPaysParDefaut}"></option>
      </select>
    </div>
  </div>

</div>
