# Frontend - PROD (Docker)

# Securite active en prod
app.security.enabled=${APP_SECURITY_ENABLED:true}

# Base URL backend cote conteneur frontend
external.service.url=${EXTERNAL_SERVICE_URL:http://backend:8092}

# Endpoint d'authentification visible depuis le navigateur (host)
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTH_URL:http://localhost:8080/realms/sma-realm/protocol/openid-connect/auth}

# Endpoints utilises cote serveur frontend (conteneur -> reseau Docker)
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URL:http://keycloak:8080/realms/sma-realm/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URL:http://keycloak:8080/realms/sma-realm/protocol/openid-connect/certs}

# Niveau de log plus sobre en prod
logging.level.org.springframework=INFO

