spring.application.name=frontend
server.port=8091
vehicule.json.path=classpath:vehicules.json

spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/, classpath:/templates/
spring.devtools.add-properties=false

# En local (hors Docker), le frontend appelle le backend via localhost.
# En Docker, compose.yaml surcharge via EXTERNAL_SERVICE_URL=http://backend:8092.
external.service.url=${EXTERNAL_SERVICE_URL:http://localhost:8092}

# -----------------------------------------------------------------------------
# SECURITY (Keycloak SSO)
# - profils dev/prod portent les bascules d'activation et les URIs provider
# -----------------------------------------------------------------------------
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:sma-thymeleaf-frontend}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=${KEYCLOAK_CLIENT_AUTH_METHOD:none}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
# Utiliser uniquement openid evite l'appel userinfo (qui peut echouer en Docker quand l'issuer public est localhost)
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# logs configuration communes
logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO


