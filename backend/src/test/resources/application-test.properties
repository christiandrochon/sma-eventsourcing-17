  spring.datasource.url=jdbc:h2:mem:sma_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Override any global hibernate.dialect (defined in application.properties) for tests
# to ensure Hibernate uses H2-compatible SQL and does NOT execute Postgres-specific
# commands like `set client_min_messages = WARNING` when running unit/integration tests.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

axon.axonserver.enabled=false

# Les migrations SQL de prod ciblent PostgreSQL; on les désactive sur H2 en tests unitaires.
spring.flyway.enabled=false

