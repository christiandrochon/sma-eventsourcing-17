#spring.application.name=backend-${spring.profiles.active}
spring.application.name=backend
server.port=${SERVER_PORT:8092}
# En local (hors Docker), le backend vise le frontend sur localhost.
# En Docker, compose.yaml peut surcharger via EXTERNAL_SERVICE_URL=http://frontend:8091.
external.service.url=${EXTERNAL_SERVICE_URL:http://localhost:8091}

spring.thymeleaf.cache=false
#spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
#eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

# Avec docker compose, et la conf recuperee depuis github, ca fonctionne, peu importe le profile, et fonctionne meme sans profile tout court!
#spring.profiles.active=prod

# Security: restrict Actuator exposure to critical endpoints only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# -----------------------------------------------------------------------------
# SECURITY (Keycloak / JWT)
# - app.security.enabled=false par defaut pour ne pas imposer l'auth en local
# - en prod, activer via application-prod.properties / variables d'env
# -----------------------------------------------------------------------------
app.security.enabled=${APP_SECURITY_ENABLED:false}
app.security.require-authenticated-all=${APP_SECURITY_REQUIRE_AUTHENTICATED_ALL:false}
app.security.audit-endpoints-authenticated=${APP_SECURITY_AUDIT_ENDPOINTS_AUTHENTICATED:true}
app.security.audit-required-roles=${APP_SECURITY_AUDIT_REQUIRED_ROLES:ADMIN,AUDITOR}
app.security.audit-writer-roles=${APP_SECURITY_AUDIT_WRITER_ROLES:ADMIN}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:http://localhost:8080/realms/sma-realm}

################### POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:monolithe}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


################### AUDIT (RGPD) - datasource dedie base 'audit'
audit.datasource.url=jdbc:postgresql://${AUDIT_POSTGRES_HOST:${POSTGRES_HOST:localhost}}:${AUDIT_POSTGRES_PORT:${POSTGRES_PORT:5432}}/${AUDIT_POSTGRES_DB:audit}
audit.datasource.username=${AUDIT_POSTGRES_USER:${POSTGRES_USER}}
audit.datasource.password=${AUDIT_POSTGRES_PASSWORD:${POSTGRES_PASSWORD}}


###################### JPA #################################
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=none


# -----------------------------------------------------------------------------
# FLYWAY – migrations de schéma versionnées
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Sécurité pour une base existante (déjà peuplée par ddl-auto=update)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Encodage des scripts
spring.flyway.encoding=UTF-8



#resilience4j.retry.instances.retryApi.max-attempts=3
#resilience4j.retry.instances.retryApi.wait-duration=1s
#resilience4j.retry.metrics.legacy.enabled=true
#resilience4j.retry.metrics.enabled=true


###########################################
#   AXON
# https://docs.axoniq.io/reference-guide/v/3.3/part-iv-advanced-tuning/advanced-customizations#serializers
axon.serializer.general=jackson
#axon.axonserver.servers=localhost:8124

axon.axonserver.servers=${AXON_AXONSERVER_SERVERS:localhost:8124}
axon.axonserver.enabled=true

# Traiter immediatement les events Document cote commande/projection.
axon.eventhandling.processors.fr.cdrochon.smamonolithe.document.events.mode=subscribing
axon.eventhandling.processors.fr.cdrochon.smamonolithe.document.query.services.mode=subscribing

# Mode global des processors Axon (lu par AxonConfiguration): subscribing par defaut
# Mettre "tracking" uniquement si la base de tokens supporte ce mode (ex: PostgreSQL)
app.axon.default-event-processor-mode=${APP_AXON_DEFAULT_EVENT_PROCESSOR_MODE:subscribing}

#axon.serializer.events=jackson
#axon.serializer.messages=jackson



#management.endpoint.health.show-details=always
#management.endpoints.web.exposure.include=*
#
#logging.level.io.axoniq.demo=debug
# Logs generaux reduits: les logs metier BIZ_* passent par le logger dedie BUSINESS (logback-spring.xml)
logging.file.path=${LOGGING_FILE_PATH:./logs}
logging.level.root=WARN
logging.level.fr.cdrochon.smamonolithe=WARN
logging.level.fr.cdrochon.smamonolithe.logging=INFO
logging.level.org.springframework=WARN
logging.level.org.axonframework=WARN
logging.level.org.axonframework.commandhandling=${LOG_AXON_COMMAND_LEVEL:INFO}
logging.level.org.axonframework.queryhandling=${LOG_AXON_QUERY_LEVEL:DEBUG}
logging.level.org.axonframework.eventhandling=${LOG_AXON_EVENT_LEVEL:DEBUG}
logging.level.org.hibernate=WARN
logging.level.reactor.netty=WARN

