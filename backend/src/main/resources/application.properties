#spring.application.name=backend-${spring.profiles.active}
spring.application.name=backend

#spring.profiles.group.production=gui, command, query
#server.port=8081
server.port=8092
external.service.url=http://localhost:8091
#external.service.url=http://frontend:8091

spring.thymeleaf.cache=false
#spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
#eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

# Avec docker compose, et la conf recuperee depuis github, ca fonctionne, peu importe le profile, et fonctionne meme sans profile tout court!
#spring.profiles.active=prod

# Security: restrict Actuator exposure to critical endpoints only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# -----------------------------------------------------------------------------
# SECURITY (Keycloak / JWT)
# - app.security.enabled=false par défaut pour ne pas imposer l'auth en local
# - en prod, activer via application-prod.properties / variables d'env
# -----------------------------------------------------------------------------
app.security.enabled=${APP_SECURITY_ENABLED:false}
app.security.require-authenticated-all=${APP_SECURITY_REQUIRE_AUTHENTICATED_ALL:false}
app.security.audit-endpoints-authenticated=${APP_SECURITY_AUDIT_ENDPOINTS_AUTHENTICATED:true}
app.security.audit-required-roles=${APP_SECURITY_AUDIT_REQUIRED_ROLES:ADMIN,AUDITOR}
app.security.audit-writer-roles=${APP_SECURITY_AUDIT_WRITER_ROLES:ADMIN}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:http://localhost:8080/realms/sma-realm}

################### POSTGRESQL

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:monolithe}
#spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres-monolithe}:${POSTGRES_PORT:5432}/${POSTGRES_DB:monolithe}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
################### COMMUN
spring.datasource.username=${POSTGRES_USER:postgres}
#spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}


################### AUDIT (RGPD) - datasource dedié base 'audit'
audit.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/audit
audit.datasource.username=${POSTGRES_USER:postgres}
audit.datasource.password=${POSTGRES_PASSWORD:password}
audit.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop



