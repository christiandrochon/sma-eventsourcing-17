          - CLOTURE
          - REOUVERT
          - ANNULE
          - REFUSE
          - MODIFIE
          - VALIDE
          - REJET
          - ACCEPTE
          - TRAITE
          - ENVOYE
          - RECU
          - RETOURNE
          - ARCHIVE
          - DESARCHIVE
          - SUPPRIME
          - RESTAURE
          - PURGE
