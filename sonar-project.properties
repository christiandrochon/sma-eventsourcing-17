# Sonar scanner project properties - ensure Sonar uses UTF-8
sonar.sourceEncoding=UTF-8
sonar.projectKey=christiandrochon_sma-eventsourcing-17
# sonar.host.url left to CI configuration (SonarCloud)
# Configure explicit sources to avoid scanning the whole repo (prevents accidental
# inclusion of binary/generated files which can trigger encoding warnings).
# Keep sources narrow and explicit: backend and frontend main sources.
sonar.sources=backend/src/main/java,frontend/src/main/java,frontend/src/main/resources,backend/src/main/resources
# Tests (optional): point to test sources so they are treated as tests by Sonar
sonar.tests=backend/src/test/java,frontend/src/test/java
# Exclusions to avoid scanning generated/binary/log files which can trigger encoding warnings
# - exclude build outputs, compiled .class files, logs and compressed artifacts
sonar.exclusions=**/static/img/**,**/target/**,**/logs/**,**/*.class,**/*.log,**/*.log.*,**/*.gz,**/*.zip
